<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Go Links</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 380px;
      background: #000;
      color: #fff;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    
    /* Header */
    .header {
      padding: 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .logo-icon {
      width: 20px;
      height: 20px;
      background: #fff;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      color: #000;
    }
    
    h1 {
      font-size: 16px;
      font-weight: 600;
    }
    
    .sync-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
    }
    
    .sync-status.synced {
      color: #4ade80;
    }
    
    .sync-status.error {
      color: #ff4444;
    }
    
    .sync-status.warning {
      color: #fbbf24;
    }
    
    .sync-dot {
      width: 6px;
      height: 6px;
      background: currentColor;
      border-radius: 50%;
    }
    
    /* Main Content */
    .content {
      min-height: 400px;
      background: #000;
    }
    
    /* Auth Prompt */
    .auth-prompt {
      padding: 60px 24px;
      text-align: center;
    }
    
    .auth-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 24px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .auth-prompt h2 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    
    .auth-prompt p {
      color: rgba(255, 255, 255, 0.6);
      font-size: 14px;
      margin-bottom: 32px;
      line-height: 1.6;
    }
    
    .auth-button {
      background: #fff;
      color: #000;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    
    .auth-button:hover {
      opacity: 0.9;
    }
    
    .auth-button:active {
      transform: scale(0.98);
    }
    
    /* Search Bar */
    .search-container {
      padding: 16px 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .search-wrapper {
      position: relative;
    }
    
    .search-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 10px 40px 10px 16px;
      color: #fff;
      font-size: 14px;
      transition: all 0.2s;
    }
    
    .search-input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }
    
    .search-input:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }
    
    .search-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255, 255, 255, 0.4);
      pointer-events: none;
    }
    
    /* Links List */
    .links-container {
      padding: 16px 24px;
      max-height: 320px;
      overflow-y: auto;
    }
    
    .links-container::-webkit-scrollbar {
      width: 6px;
    }
    
    .links-container::-webkit-scrollbar-track {
      background: transparent;
    }
    
    .links-container::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }
    
    .link-item {
      padding: 12px 16px;
      margin-bottom: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .link-item:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateX(2px);
    }
    
    .link-shortcut {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 4px;
      color: #4ade80;
    }
    
    .link-url {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    /* Empty State */
    .empty-state {
      padding: 60px 24px;
      text-align: center;
    }
    
    .empty-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 16px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.4);
    }
    
    .empty-state h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    
    .empty-state p {
      color: rgba(255, 255, 255, 0.6);
      font-size: 14px;
      margin-bottom: 24px;
    }
    
    /* Actions */
    .actions {
      padding: 16px 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      gap: 12px;
    }
    
    .action-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    
    .action-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }
    
    .action-btn.primary {
      background: #fff;
      color: #000;
      border-color: #fff;
    }
    
    .action-btn.primary:hover {
      opacity: 0.9;
    }
    
    .action-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    /* Spinner */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    
    /* Icons */
    svg {
      width: 16px;
      height: 16px;
      stroke-width: 2;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-top">
      <div class="logo">
        <div class="logo-icon">go</div>
        <h1>Go Links</h1>
      </div>
      <div id="syncStatus" class="sync-status">
        <div class="sync-dot"></div>
        <span>Checking...</span>
      </div>
    </div>
  </div>
  
  <div id="mainContent" class="content">
    <!-- Content will be dynamically loaded -->
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
