<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>go/link</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      width: 320px;
      padding: 20px;
      background-color: #000;
      color: #fff;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin: 0 0 20px;
      text-align: center;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }
    input {
      background-color: #000;
      border: 1px solid #333;
      color: #fff;
    }
    input::placeholder {
      color: #777;
    }
    button {
      background-color: #fff;
      color: #000;
      border: none;
      cursor: pointer;
      font-weight: 500;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #e5e5e5;
    }
    #linkList {
      margin-top: 16px;
    }
    .link-item {
      position: relative;
      background-color: #000;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .link-info {
      margin-bottom: 8px;
    }
    .link-shortcut {
      font-weight: 500;
      margin-bottom: 4px;
    }
    .link-url {
      font-size: 12px;
      color: #ccc;
      word-break: break-all;
    }
    .delete-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background-color: #333;
      color: #fff;
      border: none;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }
    .link-item:hover .delete-btn {
      display: flex;
    }
    .delete-btn:hover {
      background-color: #555;
    }
  </style>
</head>
<body>
  <h1>go/link</h1>
  <input type="text" id="shortcutInput" placeholder="Shortcut (e.g., 'yt')">
  <input type="text" id="urlInput" placeholder="URL (e.g., 'https://youtube.com')">
  <button id="addButton">Add Link</button>
  <div id="linkList"></div>
  <script src="constants.js" type="module"></script>
  <script src="popup.js" type="module"></script>
</body>
</html>
